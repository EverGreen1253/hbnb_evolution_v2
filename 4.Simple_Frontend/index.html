<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Places</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/icon.png" />
</head>
<body>
    <noscript>
        <div class="no-js">
            Please enable Javascript!
        </div>
    </noscript>
    <div id="loader">Loading Places data...</div>
    <div id="error" class="hide"></div>

    <header>
        <nav>
            <a href="login.html" id="login-link">Login</a>
        </nav>
    </header>
    <main>
        <section id="filter">
            <div class="title">Property filters</div>
            <ul>
                <li class="name">
                    <label>
                        <span>Name:</span>
                        <input name="filter-name" type="text" value="" maxlength="20" />
                    </label>
                </li>
                <li class="price">
                    <label>Max Price:</label>
                    <select name="filter-price">
                        <!-- Options will be populated dynamically -->
                    </select>
                </li>
                <li class="amenities">
                    <label>Amenities:</label>
                    <ul class="choices">
                        <!-- Labeled checkboxes will be populated dynamically -->
                    </ul>
                </li>
                <li class="search">
                    <button id="search">Search</button>
                </li>
            </ul>
        </section>
        <section id="places-list">
            <ul class="cards">
                <!-- Filled in using JS -->
            </ul>
        </section>
    </main>
    <footer>
        &copy; 2024 HBnB Evolution. All rights reserved.
    </footer>
    <script src="scripts.js"></script>
</body>
</html>
