<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Places</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/icon.png" />
</head>
<body page-id="index">
    <noscript>
        <div class="no-js">
            Please enable Javascript!
        </div>
    </noscript>
    <div id="loader">Loading Places data...</div>
    <div id="error" class="hide"></div>

    <header>
        <nav>
            <a href="login.html" id="login-link">Login</a>
        </nav>
    </header>
    <main>
        <section id="filter">
            <div class="title">Property filters</div>
            <ul>
                <li class="name">
                    <label>
                        <span>Name:</span>
                        <input class="filter-name" name="filter-name" type="text" value="" maxlength="20" />
                    </label>
                </li>
                <li class="price">
                    <label>Max Price:</label>
                    <select class="filter-price" name="filter-price">
                        <option value="0">Any</option>
                        <!-- Other options will be populated dynamically -->
                    </select>
                </li>
                <li class="amenities">
                    <label>Amenities:</label>
                    <ul class="filter-amenities">
                        <!-- Labeled checkboxes will be populated dynamically -->
                    </ul>
                </li>
                <li class="search">
                    <button id="search">Search</button>
                </li>
            </ul>
        </section>
        <section id="places-list">
            <ul class="cards">
                <!-- Filled in using JS -->
            </ul>
        </section>
        <div id="login-modal" class="hide">
            <div class="bg"></div>
            <div class="modal">
                <div class="title">Log in to your Account</div>
                <div class="body">
                    <label>
                        <span>Username: </span>
                        <input disabled type="text" name="username" placeholder="Username" />
                    </label>
                    <label>
                        <span>Password: </span>
                        <input disabled type="text" name="password" placeholder="Password" />
                    </label>
                    <div class="buttons">
                        <button disabled id="login-submit">Submit</button>
                        <button disabled id="login-cancel">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        &copy; 2024 HBnB Evolution. All rights reserved.
    </footer>
    <script src="scripts.js"></script>
</body>
</html>
